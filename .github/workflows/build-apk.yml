name: ساخت APK اندروید (بومی)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: ساخت APK دیباگ
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: استخراج خطاهای کامپایل
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "===== خطاها ====="
          grep -aE "^e: |error:|Unresolved|unresolved reference|What went wrong|> Task .*FAILED|Caused by:|error:|FAILURE:" build.log || true
          echo "===== انتهای لاگ ====="
          tail -60 build.log > errors.txt
          cat errors.txt

      - name: آپلود لاگ خطا
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-errors
          path: build.log
          if-no-files-found: ignore

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: dastiyar-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: ساخت Release (فقط برای تگ)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "APK دیباگ — از فایل پایین دانلود و نصب کنید." || \
            gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber